<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>registration form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
</head>
<body>
<div class="register-page">
<div class="central-container">
    <h1 class="register-title">what are you building today ?</h1>

    <!-- We use a form so that it can send data to your Java backend later -->
    <form class="registration-form" action="RegisterServlet" method="POST">

        <div class="input-group">
            <label for="email">email</label>
            <input type="text" id="email" name="email" required>
        </div>

        <div class="input-group">
            <label for="username">username</label>
            <input type="text" id="username" name="username" required>
        </div>

        <div class="input-group">
            <label for="password">password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div class="input-group">
            <label for="describe">describe</label>
            <input type="text" id="describe" name="describe" required>
        </div>

         <!-- Submit button triggers the form action to save to database -->
         <button type="submit" class="retro-btn register-submit-btn">Register</button>
    </form>
</div>
</div>
</body>
</html>
