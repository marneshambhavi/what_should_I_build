<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Pixel Dashboard</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-page" style="background-color: #1a0b2e;">
    
    <div class="dashboard-layout">
        <!-- LEFT SIDEBAR -->
        <aside class="sidebar-left">
            <div class="logo-area">
                <h2 class="logo-text">What<br>Should I<br>Build ?</h2>
                <div class="moon-glow"></div>
            </div>
            
            <nav class="side-nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="projects.html" class="nav-link">My Projects</a>
                <a href="achievements.html" class="nav-link">Achievements</a>
                <a href="about.html" class="nav-link">About</a>
            </nav>
        </aside>

        <!-- CENTER CONTENT -->
        <main class="main-content">
            <header class="main-header">
                <div class="greeting">
                    <h1>User Profile</h1>
                    <p>Manage your account settings and stats!</p>
                </div>
            </header>
            
            <div class="glass-panel" style="background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.15); padding: 40px; border-radius: 20px; text-align: center;">
                <div style="margin-bottom: 25px;">
                    <img src="images/userimage.png" alt="Profile avatar" style="width: 120px; height: 120px; border-radius: 20px; border: 4px solid #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);">
                </div>
                
                <h2 class="username-display" style="color: #ffd700; font-family: 'Audiowide', sans-serif; font-size: 2rem; margin-top: 0; margin-bottom: 10px;">Username</h2>
                <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 30px;"><i class="fa-solid fa-crown" style="color: #ffd700;"></i> Master Creator Account</p>
                
                <div style="max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; text-align: left; background: rgba(0,0,0,0.2); padding: 25px; border-radius: 12px; margin-bottom: 30px;">
                    <label for="email-input" style="color: var(--text-muted); font-size: 0.95rem; display: flex; align-items: center; gap: 8px;">
                        <i class="fa-solid fa-envelope"></i> Registered Email:
                    </label>
                    <div style="display: flex; gap: 10px; align-items: center; width: 100%;">
                        <input type="email" id="email-input" readonly value="Loading..." style="flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.4); color: white; font-size: 1rem; outline: none; transition: border-color 0.3s;">
                        <button id="edit-email-btn" class="btn-primary" style="padding: 10px 18px; font-size: 0.95rem; margin-top: 0; background-color: #ffd700; color: #1a0b2e; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 6px; min-width: 90px; justify-content: center;">
                            <i class="fa-solid fa-pen"></i> <span>Edit</span>
                        </button>
                    </div>
                    <p id="email-status-msg" style="margin: 5px 0 0 0; font-size: 0.85rem; display: none;"></p>
                </div>

                <!-- Custom styled Logout / Back Buttons -->
                <div style="display: flex; justify-content: center; max-width: 400px; margin: 0 auto;">
                    <button id="logout-btn" class="btn-primary" style="width: 100%; padding: 12px; font-size: 1rem; background-color: #ef4444; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px;">
                        <i class="fa-solid fa-power-off"></i> Log Out
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- JS for basic profile session, email edit, and logout -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Fetch session
            fetch('GetSessionServlet')
                .then(response => response.text())
                .then(username => {
                    if (username && username.trim() !== "" && username !== "Guest") {
                        const displays = document.querySelectorAll('.username-display');
                        displays.forEach(d => d.innerText = username);
                        
                        // Load email
                        fetchEmail();
                    } else {
                        window.location.href = 'login.html';
                    }
                })
                .catch(err => console.error("Error fetching session:", err));

            const emailInput = document.getElementById('email-input');
            const editBtn = document.getElementById('edit-email-btn');
            const statusMsg = document.getElementById('email-status-msg');

            function fetchEmail() {
                fetch('UserProfileServlet')
                    .then(response => {
                        if (!response.ok) throw new Error("Could not fetch email");
                        return response.text();
                    })
                    .then(email => {
                        emailInput.value = email;
                    })
                    .catch(err => {
                        console.error(err);
                        emailInput.value = "Error loading email";
                    });
            }

            // Edit / Save toggle
            editBtn.addEventListener('click', () => {
                const isReadOnly = emailInput.hasAttribute('readonly');
                const icon = editBtn.querySelector('i');
                const text = editBtn.querySelector('span');

                if (isReadOnly) {
                    // Switch to edit mode
                    emailInput.removeAttribute('readonly');
                    emailInput.style.borderColor = '#ffd700';
                    emailInput.focus();
                    icon.className = 'fa-solid fa-floppy-disk';
                    text.innerText = 'Save';
                    editBtn.style.backgroundColor = '#4ade80';
                } else {
                    // Save action
                    const newEmail = emailInput.value.trim();
                    if (!newEmail) {
                        showStatus("Email cannot be empty", "red");
                        return;
                    }

                    // Simple front-end regex check before sending to server
                    const emailRegex = /^[A-Za-z0-9+_.-]+@(.+)$/;
                    if (!emailRegex.test(newEmail)) {
                        showStatus("Invalid email format", "red");
                        return;
                    }

                    editBtn.disabled = true;
                    showStatus("Saving...", "yellow");

                    fetch('UserProfileServlet', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded'
                        },
                        body: 'email=' + encodeURIComponent(newEmail)
                    })
                    .then(res => res.text())
                    .then(result => {
                        editBtn.disabled = false;
                        if (result === 'success') {
                            emailInput.setAttribute('readonly', 'true');
                            emailInput.style.borderColor = 'rgba(255,255,255,0.15)';
                            icon.className = 'fa-solid fa-pen';
                            text.innerText = 'Edit';
                            editBtn.style.backgroundColor = '#ffd700';
                            showStatus("Email updated successfully!", "#4ade80");
                            setTimeout(() => {
                                statusMsg.style.display = 'none';
                            }, 3000);
                        } else {
                            showStatus(result.replace('error:', ''), 'red');
                        }
                    })
                    .catch(err => {
                        editBtn.disabled = false;
                        showStatus("Server error, try again later.", "red");
                        console.error(err);
                    });
                }
            });

            function showStatus(msg, color) {
                statusMsg.innerText = msg;
                statusMsg.style.color = color;
                statusMsg.style.display = 'block';
            }

            // Logout execution
            document.getElementById('logout-btn').addEventListener('click', () => {
                if (confirm("Are you sure you want to log out?")) {
                    window.location.href = 'login.html';
                }
            });
        });
    </script>
</body>
</html>
