<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achievements - Pixel Dashboard</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-page" style="background-color: #1a0b2e;">
    
    <div class="dashboard-layout">
        <!-- LEFT SIDEBAR -->
        <aside class="sidebar-left">
            <div class="logo-area">
                <h2 class="logo-text">What<br>Should I<br>Build ?</h2>
                <div class="moon-glow"></div>
            </div>
            
            <nav class="side-nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="projects.html" class="nav-link">My Projects</a>
                <a href="achievements.html" class="nav-link active">Achievements</a>
                <a href="about.html" class="nav-link">About</a>
            </nav>
        </aside>

        <!-- CENTER CONTENT -->
        <main class="main-content">
            <header class="main-header">
                <div class="greeting">
                    <h1>Your Achievements</h1>
                    <p>Unlock cool badges as you design and curate your next big projects!</p>
                </div>
            </header>
            
            <div id="achievements-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px;">
                <!-- Dynamically populated achievements -->
                <div class="glass-panel" style="grid-column: 1/-1; text-align: center; padding: 40px;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 2.5rem; color: #ffd700; margin-bottom: 15px;"></i>
                    <h3>Loading achievements...</h3>
                </div>
            </div>
        </main>

        <!-- RIGHT SIDEBAR -->
        <aside class="sidebar-right">
            <!-- Profile Badge -->
            <a href="profile.html" style="text-decoration: none; color: inherit;">
                <div class="profile-badge glass-panel" style="cursor: pointer; transition: transform 0.2s;">
                    <div class="avatar">
                        <img src="images/userimage.png" alt="User Avatar" style="width: 40px; height: 40px; border-radius: 8px;">
                    </div>
                    <div class="user-info">
                        <span class="username">Username</span>
                    </div>
                </div>
            </a>

            <!-- Quick Info -->
            <div class="widget glass-panel">
                <h3 class="widget-title">User Level</h3>
                <div style="text-align: center; padding: 15px 0;">
                    <div id="user-level-val" style="font-size: 2.8rem; font-weight: bold; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5);">Level 1</div>
                    <p id="badges-unlocked-text" style="color: var(--text-muted); margin: 5px 0 0 0; font-size: 0.95rem;">0 / 4 Badges Unlocked</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- JS for achievements -->
    <script src="js/achievements.js?v=1.1"></script>
</body>
</html>
