<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IdeaQuest</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Using the same futuristic font -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
</head>
<body>
<div class="login-page">
    <div class="central-container">
        <h1 class="login-title">what are you building today ?</h1>
        
        <!-- We use a form so that it can send data to your Java backend later -->
        <form class="login-form" action="LoginServlet" method="POST">
            
            <div class="input-group">
                <label for="username">username</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="input-group">
                <label for="password">password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <!-- Using a button instead of an 'a' tag so it submits the form -->
            <button type="submit" class="retro-btn login-submit-btn">Login</button>
            
        </form>
    </div>
</div>
</body>
</html>
